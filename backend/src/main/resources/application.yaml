spring:
  application:
    name: joblens

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JOBLENS_SESSION
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

joblens:
  documents:
    storage-root: ${DOCUMENT_STORAGE_ROOT:${java.io.tmpdir}/joblens-documents}
  notifications:
    initial-delay: ${NOTIFICATION_INITIAL_DELAY:PT1M}
    interval: ${NOTIFICATION_INTERVAL:PT15M}
