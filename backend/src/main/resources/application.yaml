spring:
  application:
    name: joblens

  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JOBLENS_SESSION
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
