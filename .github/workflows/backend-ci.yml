name: Backend CI

on:
  push:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Java 21 build and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check Docker availability
        run: docker info

      - name: Build and run all tests
        working-directory: backend
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Require executed PostgreSQL integration tests
        run: python3 scripts/check-ci-test-reports.py backend/target/surefire-reports

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified application JAR
        uses: actions/upload-artifact@v7
        with:
          name: joblens-backend-jar
          path: backend/target/joblens-*.jar
          if-no-files-found: error
          retention-days: 7
